name: Deploy slides to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout deck
        uses: actions/checkout@v4

      # Pinned deliberately. 557474e = FNNDSC/slidedown#2 head (Backspace returns
      # to the nexus; 'f' fullscreen; selection pulse), on top of the #1 merge. Repin to the #2
      # merge commit once it lands on main.
      - name: Checkout slidedown
        uses: actions/checkout@v4
        with:
          repository: FNNDSC/slidedown
          ref: 557474e6ec1d69bc8c04dcab692e19f20bfc4b6a
          path: .slidedown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install slidedown
        run: pip install -e .slidedown

      - name: Build deck
        run: slidedown . talk --inputFile talk.sd --theme terminal

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: talk

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
